<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>佑錫花路旅程</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3D2E24;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #E2D5C7;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #score-badge {
      position: absolute;
      top: calc(75px + env(safe-area-inset-top));
      left: 20px;
      z-index: 60;
      color: #3D2E24;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
      pointer-events: none;
      display: flex;
      align-items: center;
      line-height: 1.2;
      background: none;
      border: none;
      padding: 0;
      box-shadow: none;
    }

    @media (orientation: portrait) {
      #game-wrapper::after {
        content: "📱 請將手機旋轉至橫向以獲得最佳體驗";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(226, 213, 199, 0.98);
        color: #3D2E24;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 1.2rem;
        z-index: 200;
        padding: 20px;
        box-sizing: border-box;
      }
    }

    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(45, 32, 23, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 30;
      text-align: center;
      padding: 10px;
    }

    #end-screen {
      z-index: 1000 !important;
    }

    #start-screen {
      justify-content: center;
      padding-top: 30px;
      z-index: 100;
    }

    #event-screen {
      z-index: 500;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.6rem;
      color: #FF6B81;
      margin-bottom: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* 字體大小已調大並優化行距 */
    p.intro-text {
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 14px;
      max-width: 560px;
      text-align: center;
      color: #FFF8F5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    #final-score {
      font-size: 1.05rem;
      line-height: 1.8;
      text-align: center;
      color: #FFF8F5;
      margin: 15px 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #E88D67, #FF6B81);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(232, 141, 103, 0.5);
      white-space: nowrap;
      position: relative;
      z-index: 1001;
    }

    .btn-secondary {
      background: linear-gradient(45deg, #8C6D58, #A3826C);
      box-shadow: 0 4px 12px rgba(140, 109, 88, 0.5);
    }

    #start-btn {
      animation: pulse 1.4s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255, 107, 129, 0.5);
      }
      100% {
        transform: scale(1.08);
        box-shadow: 0 0 22px rgba(255, 107, 129, 0.9);
      }
    }

    .btn:active {
      transform: scale(0.95);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 25px;
      padding-bottom: env(safe-area-inset-bottom);
      pointer-events: none;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .arrow-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arrow-label {
      position: absolute;
      top: 42px;
      font-size: 1.2rem;
      color: #FFFFFF;
      opacity: 0.65;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-weight: bold;
      pointer-events: none;
      z-index: 2;
    }

    #label-left { left: 38px; }
    #label-right { right: 38px; }

    .arrow-btn {
      width: 105px;
      height: 105px;
      object-fit: contain;
      cursor: pointer;
      opacity: 0.75;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      transition: opacity 0.2s;
    }

    .arrow-btn:active { opacity: 0.95; }
    #btn-left { transform: scaleX(-1); }
    #btn-left:active { transform: scaleX(-1) scale(0.92); }
    #btn-right:active { transform: scale(0.92); }

    .jump-btn {
      width: 110px;
      height: 110px;
      object-fit: contain;
      cursor: pointer;
      opacity: 0.75;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      transition: opacity 0.2s;
    }

    .jump-btn:active {
      opacity: 0.95;
      transform: scale(0.92);
    }

    #event-modal {
      position: relative;
      background: rgba(250, 245, 240, 0.98);
      border: 2px solid #8C6D58;
      border-radius: 16px;
      width: 55%;
      max-width: 290px;
      max-height: 80vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      overflow: visible;
      color: #3D2E24;
    }

    #event-title {
      color: #C0392B;
      font-size: 1.05rem;
      margin-bottom: 5px;
      text-align: center;
    }

    #event-image {
      width: 100%;
      max-height: 160px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 8px;
      border: none;
      background: transparent;
    }

    #close-event-btn {
      position: absolute;
      right: -115px;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px 16px;
    }
  </style>
</head>
<body>

  <audio id="game-bgm" src="game.mp3" loop preload="auto"></audio>
  <audio id="sound1" src="sound1.mp3" preload="auto"></audio>
  <audio id="sound2" src="sound2.mp3" preload="auto"></audio>
  <audio id="sound-end1" src="end1.mp3" preload="auto"></audio>
  <audio id="sound-end2" src="end2.mp3" preload="auto"></audio>

  <div id="game-wrapper">
    <div id="score-badge">累積筒筒數: <span id="total-score" style="margin-left: 6px;">0</span></div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="controls">
      <div class="btn-group">
        <div class="arrow-container">
          <div class="arrow-label" id="label-left">◄</div>
          <img src="arrow.webp" class="arrow-btn" id="btn-left" alt="向左">
        </div>
        <div class="arrow-container">
          <div class="arrow-label" id="label-right">►</div>
          <img src="arrow.webp" class="arrow-btn" id="btn-right" alt="向右">
        </div>
      </div>
      <div class="btn-group">
        <img src="jump.webp" class="jump-btn" id="btn-jump" alt="跳躍">
      </div>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="screen-overlay">
      <h1>佑錫花路旅程</h1>
      <p class="intro-text">
        歡迎來到佑錫的回顧之旅!<br>
        讓我們隨著佑錫的腳步一起回首這些年的點點滴滴~<br>
        ❤️<br>
        ●使用左右箭頭控制前進與後退、右下按鈕來跳躍<br>
        ●努力收集筒筒與狗狗，解鎖隱藏結局，陪伴佑錫步上花路🌸<br>
        若圖片未成功載入可稍等三秒或重新整理網頁喔
      </p>
      <button class="btn" id="start-btn">開始旅程</button>
    </div>

    <!-- 大事件彈窗 -->
    <div id="event-screen" class="screen-overlay hidden">
      <div id="event-modal">
        <h2 id="event-title">大事件標題</h2>
        <img id="event-image" src="1.webp" alt="事件照片">
        <button class="btn" id="close-event-btn">繼續前進</button>
      </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen" class="screen-overlay hidden">
      <h1 id="end-title">🎉結局標題</h1>
      <p id="final-score">結局文字內容</p>
      <div class="btn-row">
        <button class="btn" id="restart-btn">再次回顧</button>
        <button class="btn btn-secondary" id="back-library-btn">回到圖書館</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const GROUND_Y = Math.round(CANVAS_HEIGHT * 0.68);

    const gameBgm = document.getElementById('game-bgm');
    const sfxSound1 = document.getElementById('sound1');
    const sfxSound2 = document.getElementById('sound2');
    const sfxEnd1 = document.getElementById('end1');
    const sfxEnd2 = document.getElementById('end2');

    const DEFAULT_BGM_VOLUME = 0.12;
    const LOW_BGM_VOLUME = 0.04;

    gameBgm.volume = DEFAULT_BGM_VOLUME;
    let musicStarted = false;

    function initAudio() {
      if (!musicStarted) {
        gameBgm.play().then(() => {
          musicStarted = true;
        }).catch(() => {});
      }
    }

    function playSound1() {
      try {
        sfxSound1.currentTime = 0;
        sfxSound1.volume = 0.8;
        sfxSound1.play().catch(() => {});
      } catch (e) {}
    }

    function playSound2() {
      try {
        sfxSound2.currentTime = 0;
        sfxSound2.volume = 1.0;
        sfxSound2.play().catch(() => {});
      } catch (e) {}
    }

    function playEndSound(isPerfect) {
      try {
        gameBgm.volume = LOW_BGM_VOLUME;
        if (isPerfect) {
          sfxEnd2.currentTime = 0;
          sfxEnd2.volume = 1.0;
          sfxEnd2.play().catch(() => {});
        } else {
          sfxEnd1.currentTime = 0;
          sfxEnd1.volume = 1.0;
          sfxEnd1.play().catch(() => {});
        }
      } catch (e) {}
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    const images = {};
    function loadImage(key, src) {
      const img = new Image();
      img.src = src;
      img.onload = () => { images[key] = true; };
      img.onerror = () => { images[key] = false; };
      return img;
    }

    const imgSmall = loadImage('small', 'small.webp');
    const imgBig = loadImage('big', 'big.webp');
    const imgCake = loadImage('cake', 'cake.webp');
    const imgRunRight = loadImage('runRight', 'runright.webp');
    const imgRunLeft = loadImage('runLeft', 'runleft.webp');

    const bgImages = {};
    const BG_TOTAL_COUNT = 30; 
    
    function preloadBgImages() {
      for (let i = 1; i <= BG_TOTAL_COUNT; i++) {
        const key = 'bg' + i;
        if (!bgImages[key]) {
          const img = new Image();
          img.src = key + '.webp';
          bgImages[key] = img;
        }
      }
    }
    preloadBgImages();

    const startScreen = document.getElementById('start-screen');
    const eventScreen = document.getElementById('event-screen');
    const endScreen = document.getElementById('end-screen');
    const eventTitle = document.getElementById('event-title');
    const eventImage = document.getElementById('event-image');
    const finalScore = document.getElementById('final-score');
    const endTitle = document.getElementById('end-title');
    const totalScoreEl = document.getElementById('total-score');

    let gameState = 'START'; 
    let collectedSmallCount = 0;
    let totalScore = 0;
    let cameraX = 0;
    let worldWidth = 28000;
    let bgLayoutCache = [];

    let fireworksTimer = 0;
    let fireworksParticles = [];
    let savedEndData = null;

    const player = {
      x: 100,
      y: GROUND_Y - 138,
      width: 110,
      height: 138,
      vx: 0,
      vy: 0,
      speed: 6.0,
      jumpPower: -12.5,
      gravity: 0.62,
      isGrounded: false,
      facing: 'right',
      walkTimer: 0
    };

    const SMALL_BASE_WIDTH = 50;
    const BIG_BASE_WIDTH = 95;
    const CAKE_BASE_WIDTH = 125;

    const eventTitles = [
      '2010年模特兒出道',
      '2015年首次米蘭伸展台',
      '2016演員出道',
      '8年無名時期',
      '2024善宰大放異彩,首次亞洲巡迴見面會',
      '2024潑髒水事件',
      '2025成立Fan Club',
      '2024-2026廣告寵兒',
      '2026 大君來了',
      '2026亞洲巡迴萬人見面會'
    ];

    let collectibles = [];
    let eventNodes = [];
    let platforms = [];
    let curvedTerrains = [];
    let slopes = [];
    let cakeObject = null;

    function getGroundYAt(x) {
      let ground = GROUND_Y;
      
      curvedTerrains.forEach(ct => {
        if (x >= ct.x && x <= ct.x + ct.w) {
          const norm = (x - ct.x) / ct.w;
          const curveVal = Math.sin(norm * Math.PI) * ct.height;
          if (ct.type === 'concave') ground = GROUND_Y + curveVal;
          else if (ct.type === 'convex') ground = GROUND_Y - curveVal;
        }
      });

      slopes.forEach(s => {
        if (x >= s.x1 && x <= s.x2) {
          const progress = (x - s.x1) / (s.x2 - s.x1);
          const slopeY = s.y1 + progress * (s.y2 - s.y1);
          if (slopeY < ground) {
            ground = slopeY;
          }
        }
      });

      platforms.forEach(p => {
        if (x >= p.x && x <= p.x + p.w) {
          if (p.y < ground) {
            ground = p.y;
          }
        }
      });

      return ground;
    }

    function addSmallItemDirect(x, offsetHeight) {
      const surfaceY = getGroundYAt(x + SMALL_BASE_WIDTH / 2);
      const finalY = surfaceY - SMALL_BASE_WIDTH - offsetHeight;
      collectibles.push({ x: x, y: finalY, collected: false });
    }

    function buildBackgroundCache() {
      bgLayoutCache = [];
      const targetHeight = (GROUND_Y - 75) + 15;
      let currentDrawX = 0;
      let imgSeqIndex = 0;

      while (currentDrawX < worldWidth) {
        const bgIndex = (imgSeqIndex % BG_TOTAL_COUNT) + 1;
        const key = 'bg' + bgIndex;
        const img = bgImages[key];

        let drawW = 816;
        if (img && img.naturalWidth > 0 && img.naturalHeight > 0) {
          drawW = targetHeight * (img.naturalWidth / img.naturalHeight);
        }

        bgLayoutCache.push({
          key: key,
          x: currentDrawX,
          w: drawW,
          h: targetHeight,
          y: GROUND_Y - targetHeight
        });

        currentDrawX += drawW;
        imgSeqIndex++;
      }
    }

    function generateLevelData() {
      collectibles = [];
      eventNodes = [];
      platforms = [];
      curvedTerrains = [];
      slopes = [];

      let currentX = 250;

      for (let i = 0; i < 5; i++) {
        const offset = (i % 2 === 1) ? 25 : 10;
        addSmallItemDirect(currentX, offset);
        currentX += 150;
      }

      currentX += 100;

      for (let b = 0; b < 10; b++) {
        let bigYOffset = 100;
        if (b === 1) bigYOffset = 110;
        else if (b === 2) bigYOffset = 60;
        else if (b % 5 === 2) bigYOffset = 70;
        else if (b % 5 === 4) bigYOffset = 110;

        let bigX = currentX + 350;

        eventNodes.push({
          x: bigX, yOffset: bigYOffset,
          title: eventTitles[b], imgIndex: b + 1,
          triggered: false, collected: false
        });

        const layoutType = b % 7;

        if (layoutType === 0) {
          platforms.push({ x: currentX, y: GROUND_Y - 30, w: 70, h: 30 });
          platforms.push({ x: currentX + 60, y: GROUND_Y - 60, w: 70, h: 60 });
          platforms.push({ x: currentX + 120, y: GROUND_Y - 90, w: 80, h: 90 });
          currentX += 260;
        } else if (layoutType === 1) {
          platforms.push({ x: currentX, y: GROUND_Y - 90, w: 80, h: 90 });
          platforms.push({ x: currentX + 70, y: GROUND_Y - 60, w: 70, h: 60 });
          platforms.push({ x: currentX + 130, y: GROUND_Y - 30, w: 70, h: 30 });
          currentX += 250;
        } else if (layoutType === 2) {
          slopes.push({ x1: currentX, y1: GROUND_Y - 90, x2: currentX + 220, y2: GROUND_Y });
          platforms.push({ x: currentX, y: GROUND_Y - 90, w: 60, h: 90 });
          currentX += 260;
        } else if (layoutType === 3) {
          platforms.push({ x: currentX, y: GROUND_Y - 40, w: 60, h: 40 });
          platforms.push({ x: currentX + 90, y: GROUND_Y - 80, w: 65, h: 20 });
          platforms.push({ x: currentX + 185, y: GROUND_Y - 120, w: 65, h: 20 });
          currentX += 300;
        } else if (layoutType === 4) {
          platforms.push({ x: currentX, y: GROUND_Y - 60, w: 70, h: 60 });
          curvedTerrains.push({ x: currentX + 60, w: 200, height: 50, type: 'concave' });
          platforms.push({ x: currentX + 250, y: GROUND_Y - 60, w: 80, h: 60 });
          currentX += 350;
        } else if (layoutType === 5) {
          curvedTerrains.push({ x: currentX, w: 240, height: 45, type: 'concave' });
          currentX += 260;
        } else {
          curvedTerrains.push({ x: currentX, w: 240, height: 40, type: 'convex' });
          currentX += 260;
        }

        platforms.push({
          x: eventNodes[b].x - 65,
          y: GROUND_Y - eventNodes[b].yOffset,
          w: 130,
          h: eventNodes[b].yOffset
        });

        currentX = eventNodes[b].x + 200;

        if (b < 9) {
          for (let s = 0; s < 10; s++) {
            const isHigh = (s % 2 === 1);
            if (s === 3 || s === 7) {
              const pY = isHigh ? GROUND_Y - 60 : GROUND_Y - 30;
              platforms.push({ x: currentX - 15, y: pY, w: 70, h: isHigh ? 60 : 30 });
            }
            const offsetHeight = isHigh ? 25 : 10;
            addSmallItemDirect(currentX, offsetHeight);
            currentX += 140;
          }
        }
      }

      currentX = eventNodes[9].x + 250;
      for (let i = 0; i < 5; i++) {
        const offset = (i % 2 === 1) ? 25 : 10;
        addSmallItemDirect(currentX, offset);
        currentX += 150;
      }

      const cakeX = currentX + 100; 
      cakeObject = {
        x: cakeX,
        w: CAKE_BASE_WIDTH,
        triggered: false
      };

      worldWidth = cakeX + 800;
      buildBackgroundCache();
    }

    const keys = { left: false,
