<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>佑錫花路旅程</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E8DFD8; /* 外圍深奶茶襯底 */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #F5EBE6; /* 遊戲主背景：淺奶茶色 */
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #score-badge {
      position: absolute;
      top: 20px;
      left: 25px;
      z-index: 20;
      color: #8C6D58;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    @media (orientation: portrait) {
      #game-wrapper::after {
        content: "📱 請將手機旋轉至橫向以獲得最佳體驗";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(245, 235, 230, 0.98);
        color: #5C4033;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 1.2rem;
        z-index: 100;
        padding: 20px;
        box-sizing: border-box;
      }
    }

    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(60, 45, 35, 0.65); /* 柔和半透明遮罩 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 30;
      text-align: center;
      padding: 10px;
    }

    /* 1. 全體往下一點，避免頂部超出畫面 */
    #start-screen {
      justify-content: center;
      padding-top: 30px; 
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.6rem;
      color: #FF6B81;
      margin-bottom: 12px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    p.intro-text {
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 20px;
      max-width: 520px;
      text-align: center;
      color: #FFF8F5;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .btn {
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #E88D67, #FF6B81);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(232, 141, 103, 0.4);
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 25px;
      padding-bottom: env(safe-area-inset-bottom);
      pointer-events: none;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .arrow-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. 箭頭文字改半透明，距離向內收緊 */
    .arrow-label {
      position: absolute;
      top: 42px;
      font-size: 1.2rem;
      color: #FFFFFF;
      opacity: 0.65; /* 半透明效果 */
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-weight: bold;
      pointer-events: none;
      z-index: 2;
    }

    #label-left {
      left: 24px; /* 向內靠攏 */
    }

    #label-right {
      right: 24px; /* 向內靠攏 */
    }

    .arrow-btn {
      width: 105px;
      height: 105px;
      object-fit: contain;
      cursor: pointer;
      opacity: 0.7;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      transition: opacity 0.2s;
    }

    .arrow-btn:active {
      opacity: 0.95;
    }

    #btn-left {
      transform: scaleX(-1);
    }

    #btn-left:active {
      transform: scaleX(-1) scale(0.92);
    }

    #btn-right:active, #btn-jump:active {
      transform: scale(0.92);
    }

    .touch-btn {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5C4033;
      font-size: 1.5rem;
      font-weight: bold;
      backdrop-filter: blur(4px);
      pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      opacity: 0.7;
    }

    .touch-btn:active {
      opacity: 0.95;
    }

    #event-modal {
      position: relative;
      background: rgba(255, 248, 245, 0.98);
      border: 2px solid #E88D67;
      border-radius: 16px;
      width: 75%;
      max-width: 380px;
      max-height: 80vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: visible;
      color: #5C4033;
    }

    #event-title {
      color: #D9534F;
      font-size: 1.15rem;
      margin-bottom: 5px;
      text-align: center;
    }

    #event-image {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 10px;
      border: none;
      background: transparent;
    }

    #close-event-btn {
      position: absolute;
      right: -125px;
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 18px;
    }

    #close-event-btn:active {
      transform: translateY(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <audio id="game-bgm" src="game.mp3" loop preload="auto"></audio>
  <audio id="sound1" src="sound1.mp3" preload="auto"></audio>
  <audio id="sound2" src="sound2.mp3" preload="auto"></audio>
  <audio id="sound-end1" src="end1.mp3" preload="auto"></audio>
  <audio id="sound-end2" src="end2.mp3" preload="auto"></audio>

  <div id="game-wrapper">
    <div id="score-badge">累積筒筒數: <span id="total-score">0</span></div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="controls">
      <div class="btn-group">
        <div class="arrow-container">
          <div class="arrow-label" id="label-left">◄</div>
          <img src="arrow.png" class="arrow-btn" id="btn-left" alt="向左">
        </div>
        <div class="arrow-container">
          <div class="arrow-label" id="label-right">►</div>
          <img src="arrow.png" class="arrow-btn" id="btn-right" alt="向右">
        </div>
      </div>
      <div class="btn-group">
        <div class="touch-btn" id="btn-jump">▲</div>
      </div>
    </div>

    <!-- 開始畫面 (更新標題說明與下移結構) -->
    <div id="start-screen" class="screen-overlay">
      <h1>佑錫花路旅程</h1>
      <p class="intro-text">
        歡迎來到佑錫的回顧之旅!<br>
        讓我們隨著佑錫的腳步一起回首這些年的點點滴滴<br>
        ❤️<br>
        使用左右箭頭控制前進與後退、右下按鈕來跳躍<br>
        努力收集筒筒與狗狗，解鎖隱藏結局，陪伴佑錫步上花路🌸
      </p>
      <button class="btn" id="start-btn">開始旅程</button>
    </div>

    <!-- 大事件彈窗 -->
    <div id="event-screen" class="screen-overlay hidden">
      <div id="event-modal">
        <h2 id="event-title">大事件標題</h2>
        <img id="event-image" src="1.png" alt="事件照片">
        <button class="btn" id="close-event-btn">繼續前進</button>
      </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen" class="screen-overlay hidden">
      <h1 id="end-title">抵達終點！</h1>
      <p id="final-score">恭喜你完成了偶像歷程巡演！</p>
      <button class="btn" id="restart-btn" style="margin-top: 15px;">再次回顧</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const GROUND_Y = Math.round(CANVAS_HEIGHT * 0.68);

    const gameBgm = document.getElementById('game-bgm');
    const sfxSound1 = document.getElementById('sound1');
    const sfxSound2 = document.getElementById('sound2');
    const sfxEnd1 = document.getElementById('sound-end1');
    const sfxEnd2 = document.getElementById('sound-end2');

    gameBgm.volume = 0.3;
    let musicStarted = false;

    function initAudio() {
      if (!musicStarted) {
        gameBgm.play().then(() => {
          musicStarted = true;
        }).catch(() => {});
      }
    }

    function playSound1() {
      try {
        sfxSound1.currentTime = 0;
        sfxSound1.volume = 0.8;
        sfxSound1.play().catch(() => {});
      } catch (e) {}
    }

    function playSound2() {
      try {
        sfxSound2.currentTime = 0;
        sfxSound2.volume = 1.0;
        sfxSound2.play().catch(() => {});
      } catch (e) {}
    }

    function playEndSound(isPerfect) {
      if (isPerfect) {
        sfxEnd2.currentTime = 0;
        sfxEnd2.volume = 1.0;
        sfxEnd2.play().catch(() => {});
      } else {
        sfxEnd1.currentTime = 0;
        sfxEnd1.volume = 1.0;
        sfxEnd1.play().catch(() => {});
      }
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    const images = {};
    function loadImage(key, src) {
      const img = new Image();
      img.src = src;
      img.onload = () => { images[key] = true; };
      img.onerror = () => { images[key] = false; };
      return img;
    }

    const imgSmall = loadImage('small', 'small.png');
    const imgBig = loadImage('big', 'big.png');
    const imgCake = loadImage('cake', 'cake.png'); // 5. 載入 cake.png 圖片
    const imgRunRight = loadImage('runRight', 'runright.png');
    const imgRunLeft = loadImage('runLeft', 'runleft.png');

    const startScreen = document.getElementById('start-screen');
    const eventScreen = document.getElementById('event-screen');
    const endScreen = document.getElementById('end-screen');
    const eventTitle = document.getElementById('event-title');
    const eventImage = document.getElementById('event-image');
    const finalScore = document.getElementById('final-score');
    const endTitle = document.getElementById('end-title');
    const totalScoreEl = document.getElementById('total-score');

    let gameState = 'START';
    let totalScore = 0;
    let cameraX = 0;
    let worldWidth = 28000;

    const player = {
      x: 100,
      y: GROUND_Y - 138,
      width: 110,
      height: 138,
      vx: 0,
      vy: 0,
      speed: 6.0,
      jumpPower: -12.5,
      gravity: 0.62,
      isGrounded: false,
      facing: 'right',
      walkTimer: 0
    };

    const SMALL_BASE_WIDTH = 50;
    const BIG_BASE_WIDTH = 95;
    const CAKE_BASE_WIDTH = 130; // 蛋糕圖片寬度

    const eventTitles = [
      '2010年模特兒出道',
      '2015年首次米蘭伸展台',
      '2016演員出道',
      '8年無名時期',
      '2024善宰大放異彩,首次亞洲巡迴見面會',
      '2024潑髒水事件',
      '2025成立Fan Club',
      '2024-2026廣告寵兒',
      '2026 大君來了',
      '2026亞洲巡迴萬人見面會'
    ];

    let collectibles = [];
    let eventNodes = [];
    let platforms = [];
    let curvedTerrains = [];
    let cakeObject = null; // 終點蛋糕物件

    // 4. 嚴格碰撞與重疊保護機制
    function isNearBigEvent(x, margin = 280) {
      return eventNodes.some(e => Math.abs(e.x - x) < margin);
    }

    function addSmallItem(x, targetY, isAbsoluteY = false) {
      // 若該位置過於靠近任何大事件本體，則直接跳過避免重疊
      if (isNearBigEvent(x)) return;

      let finalY = 0;
      if (isAbsoluteY) {
        finalY = targetY;
      } else {
        const safeYOffset = Math.max(55, targetY);
        finalY = GROUND_Y - safeYOffset;
      }
      if (finalY > GROUND_Y - SMALL_BASE_WIDTH) {
        finalY = GROUND_Y - SMALL_BASE_WIDTH - 5;
      }
      collectibles.push({ x: x, y: finalY, collected: false });
    }

    function generateLevelData() {
      collectibles = [];
      eventNodes = [];
      platforms = [];
      curvedTerrains = [];

      let currentX = 350;

      // 預先規劃 10 個 Big 事件的位置，方便防重疊判定
      let tempX = currentX + 800;
      for (let b = 0; b < 10; b++) {
        let bigX = tempX;
        let bigYOffset = 100;
        if (b % 5 === 1) bigYOffset = 160;
        if (b % 5 === 2) bigYOffset = 130;
        if (b % 5 === 4) bigYOffset = 150;

        eventNodes.push({
          x: bigX, yOffset: bigYOffset,
          title: eventTitles[b], imgIndex: b + 1,
          triggered: false, collected: false
        });
        tempX += 2200; // 各大事件之間保持寬裕距離
      }

      // 前置 Small 筒筒
      for (let i = 0; i < 5; i++) {
        addSmallItem(currentX, (i % 2 === 1) ? 140 : 60);
        currentX += 160;
      }

      // 3. 增加更多豐富階梯地形與排列組合
      for (let b = 0; b < 10; b++) {
        const currentEvent = eventNodes[b];
        const layoutType = b % 5;

        if (layoutType === 0) {
          // 組合一：金字塔雙層階梯
          platforms.push({ x: currentX, y: GROUND_Y - 40, w: 70, h: 40 });
          platforms.push({ x: currentX + 60, y: GROUND_Y - 80, w: 70, h: 80 });
          platforms.push({ x: currentX + 120, y: GROUND_Y - 120, w: 90, h: 120 });
          platforms.push({ x: currentX + 200, y: GROUND_Y - 80, w: 70, h: 80 });
          platforms.push({ x: currentX + 260, y: GROUND_Y - 40, w: 70, h: 40 });

          addSmallItem(currentX + 10, GROUND_Y - 40 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 270, GROUND_Y - 40 - SMALL_BASE_WIDTH - 8, true);
          currentX += 450;

        } else if (layoutType === 1) {
          // 組合二：三連空中懸浮步梯
          platforms.push({ x: currentX, y: GROUND_Y - 50, w: 60, h: 50 });
          platforms.push({ x: currentX + 80, y: GROUND_Y - 110, w: 70, h: 20 });
          platforms.push({ x: currentX + 170, y: GROUND_Y - 160, w: 100, h: 20 });
          platforms.push({ x: currentX + 290, y: GROUND_Y - 100, w: 70, h: 100 });

          addSmallItem(currentX + 5, 60);
          addSmallItem(currentX + 300, GROUND_Y - 100 - SMALL_BASE_WIDTH - 8, true);
          currentX += 480;

        } else if (layoutType === 2) {
          // 組合三：谷底凹弧與鋸齒多重階梯
          curvedTerrains.push({ x: currentX, w: 260, height: 50, type: 'concave' });
          platforms.push({ x: currentX + 250, y: GROUND_Y - 50, w: 60, h: 50 });
          platforms.push({ x: currentX + 300, y: GROUND_Y - 90, w: 60, h: 90 });
          platforms.push({ x: currentX + 350, y: GROUND_Y - 130, w: 110, h: 130 });

          addSmallItem(currentX + 100, 60);
          currentX += 580;

        } else if (layoutType === 3) {
          // 組合四：雙峰連貫階梯
          platforms.push({ x: currentX, y: GROUND_Y - 50, w: 60, h: 50 });
          platforms.push({ x: currentX + 50, y: GROUND_Y - 100, w: 60, h: 100 });
          platforms.push({ x: currentX + 130, y: GROUND_Y - 60, w: 60, h: 60 });
          platforms.push({ x: currentX + 180, y: GROUND_Y - 120, w: 100, h: 120 });

          addSmallItem(currentX + 10, GROUND_Y - 50 - SMALL_BASE_WIDTH - 8, true);
          currentX += 420;

        } else {
          // 組合五：凸丘 + 錯落高低跨躍平台
          curvedTerrains.push({ x: currentX, w: 240, height: 45, type: 'convex' });
          platforms.push({ x: currentX + 230, y: GROUND_Y - 60, w: 60, h: 60 });
          platforms.push({ x: currentX + 300, y: GROUND_Y - 110, w: 60, h: 110 });
          platforms.push({ x: currentX + 370, y: GROUND_Y - 150, w: 110, h: 150 });

          addSmallItem(currentX + 90, 110);
          currentX += 560;
        }

        // 大事件平台與 Big 位置綁定
        platforms.push({
          x: currentEvent.x - 65,
          y: GROUND_Y - currentEvent.yOffset,
          w: 130,
          h: currentEvent.yOffset
        });

        // 銜接區域：持續佈設 Small（會由 isNearBigEvent 自動避開 Big）
        currentX = currentEvent.x + 250;
        for (let s = 0; s < 7; s++) {
          const isHigh = (s % 2 === 1);
          if (s === 2 || s === 5) {
            const pY = isHigh ? GROUND_Y - 80 : GROUND_Y - 40;
            platforms.push({ x: currentX - 15, y: pY, w: 70, h: isHigh ? 80 : 40 });
            addSmallItem(currentX, pY - SMALL_BASE_WIDTH - 8, true);
          } else {
            addSmallItem(currentX, isHigh ? 140 : 60);
          }
          currentX += 170;
        }
      }

      // 收尾區段
      for (let i = 0; i < 5; i++) {
        addSmallItem(currentX, (i % 2 === 1) ? 130 : 60);
        currentX += 170;
      }

      // 5. 終點放置 Cake 蛋糕物件
      const cakeX = currentX + 300;
      cakeObject = {
        x: cakeX,
        y: GROUND_Y - CAKE_BASE_WIDTH * 1.1,
        w: CAKE_BASE_WIDTH,
        h: CAKE_BASE_WIDTH * 1.1,
        triggered: false
      };

      worldWidth = cakeX + 600;
    }

    const keys = { left: false, right: false, jump: false };

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.isGrounded && gameState === 'PLAYING') {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    const setupTouchBtn = (elementId, keyName) => {
      const el = document.getElementById(elementId);
      if (!el) return;
      const start = (e) => { e.preventDefault(); initAudio(); keys[keyName] = true; };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
    };

    setupTouchBtn('btn-left', 'left');
    setupTouchBtn('btn-right', 'right');

    const jumpBtn = document.getElementById('btn-jump');
    if (jumpBtn) {
      const triggerJump = (e) => {
        if (e) e.preventDefault();
        initAudio();
        if (player.isGrounded && gameState === 'PLAYING') {
          player.vy = player.jumpPower;
          player.isGrounded = false;
        }
      };
      jumpBtn.addEventListener('touchstart', triggerJump);
      jumpBtn.addEventListener('mousedown', triggerJump);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      startScreen.classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    });

    document.getElementById('close-event-btn').addEventListener('click', () => {
      eventScreen.classList.add('hidden');
      gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      resetGame();
      endScreen.classList.add('hidden');
      if (musicStarted) gameBgm.play().catch(() => {});
      gameState = 'PLAYING';
    });

    function updateScoreDisplay() {
      totalScoreEl.innerText = totalScore.toLocaleString();
    }

    function resetGame() {
      totalScore = 0;
      updateScoreDisplay();

      generateLevelData();

      player.x = 100;
      player.y = GROUND_Y - player.height;
      player.vx = 0;
      player.vy = 0;
      player.walkTimer = 0;
      cameraX = 0;
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.walkTimer += 0.1;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.walkTimer += 0.1;
      } else {
        player.vx = 0;
        player.walkTimer = 0;
      }

      player.vy += player.gravity;

      let nextX = player.x + player.vx;
      const playerBottom = player.y + player.height;

      platforms.forEach(p => {
        if (playerBottom > p.y + 8 && player.y < p.y + p.h - 5) {
          if (player.x + player.width <= p.x && nextX + player.width > p.x) {
            nextX = p.x - player.width;
          } else if (player.x >= p.x + p.w && nextX < p.x + p.w) {
            nextX = p.x + p.w;
          }
        }
      });

      player.x = nextX;
      player.y += player.vy;

      let currentGround = GROUND_Y;
      player.isGrounded = false;

      const playerCenterX = player.x + player.width * 0.5;

      curvedTerrains.forEach(ct => {
        if (playerCenterX >= ct.x && playerCenterX <= ct.x + ct.w) {
          const norm = (playerCenterX - ct.x) / ct.w;
          const curveVal = Math.sin(norm * Math.PI) * ct.height;
          if (ct.type === 'concave') {
            currentGround = GROUND_Y + curveVal;
          } else if (ct.type === 'convex') {
            currentGround = GROUND_Y - curveVal;
          }
        }
      });

      platforms.forEach(p => {
        if (player.x + player.width * 0.75 > p.x && player.x + player.width * 0.25 < p.x + p.w) {
          if (player.y + player.height >= p.y - 14 && player.y + player.height <= p.y + 25 && player.vy >= 0) {
            currentGround = Math.min(currentGround, p.y);
          }
        }
      });

      if (player.y + player.height >= currentGround) {
        player.y = currentGround - player.height;
        player.vy = 0;
        player.isGrounded = true;
      }

      if (player.x < 0) player.x = 0;

      // 5. 碰觸 Cake 圖案觸發結局
      if (cakeObject && !cakeObject.triggered) {
        if (player.x < cakeObject.x + cakeObject.w &&
            player.x + player.width > cakeObject.x &&
            player.y < cakeObject.y + cakeObject.h &&
            player.y + player.height > cakeObject.y) {

          cakeObject.triggered = true;
          gameState = 'END';

          const allSmallCollected = collectibles.every(c => c.collected);
          const allBigCollected = eventNodes.every(e => e.collected);
          const isPerfectEnd = allSmallCollected && allBigCollected;

          playEndSound(isPerfectEnd);

          if (isPerfectEnd) {
            endTitle.innerText = "🌟 完美滿貫結局！";
            finalScore.innerHTML = `完美達成！你收集到了全數筒筒與 10 大歷程！<br>最終完美總得分：<b>${totalScore.toLocaleString()}</b> 分！`;
          } else {
            endTitle.innerText = "🎉 抵達巡演終點！";
            finalScore.innerHTML = `恭喜你完成了偶像歷程巡演！<br>最終總得分：<b>${totalScore.toLocaleString()}</b> 分！`;
          }

          endScreen.classList.remove('hidden');
        }
      }

      cameraX = player.x - CANVAS_WIDTH / 3;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > worldWidth - CANVAS_WIDTH) cameraX = worldWidth - CANVAS_WIDTH;

      // Small 筒筒碰撞收集
      collectibles.forEach(c => {
        if (!c.collected) {
          if (player.x < c.x + SMALL_BASE_WIDTH &&
              player.x + player.width > c.x &&
              player.y < c.y + SMALL_BASE_WIDTH &&
              player.y + player.height > c.y) {
            c.collected = true;
            totalScore += 100000;
            updateScoreDisplay();
            playSound1();
          }
        }
      });

      // Big 大事件精準碰撞判定
      eventNodes.forEach(e => {
        if (!e.collected) {
          const bigH = BIG_BASE_WIDTH * 1.2;
          const bigY = GROUND_Y - e.yOffset - bigH;
          const hitW = BIG_BASE_WIDTH * 0.5;
          const hitX = e.x - hitW / 2;

          if (player.x < hitX + hitW &&
              player.x + player.width > hitX &&
              player.y < bigY + bigH &&
              player.y + player.height > bigY + 20) {

            e.collected = true;
            e.triggered = true;
            totalScore += 500000;
            updateScoreDisplay();
            playSound2();

            gameState = 'PAUSED';
            eventTitle.innerText = e.title;
            eventImage.src = `${e.imgIndex}.png`;
            eventScreen.classList.remove('hidden');
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // 6. 淺奶茶配色對比優化：地平線條
      ctx.strokeStyle = '#D9826C';
      ctx.lineWidth = 4;
      ctx.beginPath();

      let stepX = 15;
      ctx.moveTo(0, GROUND_Y);
      for (let px = 0; px <= worldWidth; px += stepX) {
        let py = GROUND_Y;
        for (let ct of curvedTerrains) {
          if (px >= ct.x && px <= ct.x + ct.w) {
            const norm = (px - ct.x) / ct.w;
            const curveVal = Math.sin(norm * Math.PI) * ct.height;
            py = ct.type === 'concave' ? GROUND_Y + curveVal : GROUND_Y - curveVal;
            break;
          }
        }
        ctx.lineTo(px, py);
      }
      ctx.stroke();

      // 繪製階梯與平台 (淺奶茶搭配暖色調邊框)
      platforms.forEach(p => {
        ctx.fillStyle = 'rgba(232, 213, 196, 0.75)';
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = '#C29B85';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = '#FFF8F5';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.w, p.y);
        ctx.stroke();
      });

      // 繪製 Big 事件圖案
      eventNodes.forEach(e => {
        if (!e.collected) {
          if (imgBig.complete && imgBig.naturalWidth > 0) {
            const aspect = imgBig.naturalHeight / imgBig.naturalWidth;
            const drawW = BIG_BASE_WIDTH;
            const drawH = drawW * aspect;
            ctx.drawImage(imgBig, e.x - drawW/2, GROUND_Y - e.yOffset - drawH, drawW, drawH);
          } else {
            ctx.fillStyle = '#E88D67';
            ctx.fillRect(e.x - 30, GROUND_Y - e.yOffset - 90, 60, 90);
          }
        }
      });

      // 5. 繪製 Cake 蛋糕終點
      if (cakeObject) {
        if (imgCake.complete && imgCake.naturalWidth > 0) {
          ctx.drawImage(imgCake, cakeObject.x, cakeObject.y, cakeObject.w, cakeObject.h);
        } else {
          ctx.fillStyle = '#FF6B81';
          ctx.fillRect(cakeObject.x, cakeObject.y, cakeObject.w, cakeObject.h);
        }
      }

      // 繪製 Small 筒筒
      collectibles.forEach(c => {
        if (!c.collected) {
          if (imgSmall.complete && imgSmall.naturalWidth > 0) {
            const aspect = imgSmall.naturalHeight / imgSmall.naturalWidth;
            const drawW = SMALL_BASE_WIDTH;
            const drawH = drawW * aspect;
            ctx.drawImage(imgSmall, c.x, c.y, drawW, drawH);
          } else {
            ctx.fillStyle = '#FF758c';
            ctx.beginPath();
            ctx.arc(c.x + 25, c.y + 25, 20, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });

      // 繪製主角
      const curImg = player.facing === 'left' ? imgRunLeft : imgRunRight;
      ctx.save();

      const centerX = player.x + player.width / 2;
      const centerY = player.y + player.height / 2;
      ctx.translate(centerX, centerY);

      if (player.vx !== 0 && player.isGrounded) {
        const angle = Math.sin(player.walkTimer) * 0.2;
        ctx.rotate(angle);
      }

      if (curImg.complete && curImg.naturalWidth > 0) {
        ctx.drawImage(curImg, -player.width / 2, -player.height / 2, player.width, player.height);
      } else {
        ctx.fillStyle = '#E88D67';
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
      }
      ctx.restore();

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    generateLevelData();
    gameLoop();
  </script>
