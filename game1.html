<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>佑錫花路旅程</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d1a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #1a1a2e;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #score-badge {
      position: absolute;
      top: 55px;
      left: 25px;
      z-index: 20;
      color: #87cefa;
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 10px rgba(135, 206, 250, 0.5);
      pointer-events: none;
    }

    @media (orientation: portrait) {
      #game-wrapper::after {
        content: "📱 請將手機旋轉至橫向以獲得最佳體驗";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 1.2rem;
        z-index: 100;
        padding: 20px;
        box-sizing: border-box;
      }
    }

    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 30;
      text-align: center;
      padding: 10px;
    }

    /* 開始畫面整體位置往上移動 */
    #start-screen {
      justify-content: flex-start;
      padding-top: 45px;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.7rem;
      color: #ff2a74;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(255, 42, 116, 0.5);
    }

    /* 說明內文精準置中與排版 */
    p.intro-text {
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 20px;
      max-width: 520px;
      text-align: center;
    }

    .btn {
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #00bfff, #87cefa);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 191, 255, 0.4);
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 25px;
      padding-bottom: env(safe-area-inset-bottom);
      pointer-events: none;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 25px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .arrow-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 方向鍵標籤圖案位置微調：左邊更左，右邊更右 */
    .arrow-label {
      position: absolute;
      top: 42px;
      font-size: 1.3rem;
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      font-weight: bold;
      pointer-events: none;
      z-index: 2;
    }

    #label-left {
      left: 36px;
    }

    #label-right {
      right: 36px;
    }

    .arrow-btn {
      width: 110px;
      height: 110px;
      object-fit: contain;
      cursor: pointer;
      opacity: 0.6;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.85));
      transition: opacity 0.2s;
    }

    .arrow-btn:active {
      opacity: 0.9;
    }

    #btn-left {
      transform: scaleX(-1);
    }

    #btn-left:active {
      transform: scaleX(-1) scale(0.92);
    }

    #btn-right:active, #btn-jump:active {
      transform: scale(0.92);
    }

    .touch-btn {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.6rem;
      font-weight: bold;
      backdrop-filter: blur(4px);
      pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.85);
      opacity: 0.6;
    }

    .touch-btn:active {
      opacity: 0.9;
    }

    #event-modal {
      position: relative;
      background: rgba(20, 20, 35, 0.95);
      border: 2px solid #87cefa;
      border-radius: 16px;
      width: 75%;
      max-width: 380px;
      max-height: 80vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: visible;
    }

    #event-title {
      color: #87cefa;
      font-size: 1.15rem;
      margin-bottom: 5px;
      text-align: center;
    }

    #event-image {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 10px;
      border: none;
      background: transparent;
    }

    #close-event-btn {
      position: absolute;
      right: -130px;
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 18px;
      box-shadow: 0 4px 15px rgba(0, 191, 255, 0.6);
    }

    #close-event-btn:active {
      transform: translateY(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <audio id="game-bgm" src="game.mp3" loop preload="auto"></audio>
  <audio id="sound1" src="sound1.mp3" preload="auto"></audio>
  <audio id="sound2" src="sound2.mp3" preload="auto"></audio>
  <audio id="sound-end1" src="end1.mp3" preload="auto"></audio>
  <audio id="sound-end2" src="end2.mp3" preload="auto"></audio>

  <div id="game-wrapper">
    <div id="score-badge">累積筒筒數: <span id="total-score">0</span></div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="controls">
      <div class="btn-group">
        <div class="arrow-container">
          <div class="arrow-label" id="label-left">◄</div>
          <img src="arrow.png" class="arrow-btn" id="btn-left" alt="向左">
        </div>
        <div class="arrow-container">
          <div class="arrow-label" id="label-right">►</div>
          <img src="arrow.png" class="arrow-btn" id="btn-right" alt="向右">
        </div>
      </div>
      <div class="btn-group">
        <div class="touch-btn" id="btn-jump">▲</div>
      </div>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="screen-overlay">
      <h1>佑錫花路旅程</h1>
      <p class="intro-text">
        歡迎來到佑錫的回顧之旅!<br>
        讓我們隨著佑錫的腳步一起回首這些年的點點滴滴❤️~<br>
        使用左右箭頭控制前進與後退、右下按鈕來跳躍<br>
        努力收集筒筒與狗狗，解鎖隱藏結局，陪伴佑錫步上花路🌸
      </p>
      <button class="btn" id="start-btn">開始旅程</button>
    </div>

    <!-- 大事件彈窗 -->
    <div id="event-screen" class="screen-overlay hidden">
      <div id="event-modal">
        <h2 id="event-title">大事件標題</h2>
        <img id="event-image" src="1.png" alt="事件照片">
        <button class="btn" id="close-event-btn">繼續前進</button>
      </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen" class="screen-overlay hidden">
      <h1 id="end-title">抵達終點！</h1>
      <p id="final-score">恭喜你完成了偶像歷程巡演！</p>
      <button class="btn" id="restart-btn">再次回顧</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const GROUND_Y = Math.round(CANVAS_HEIGHT * 0.65);

    const gameBgm = document.getElementById('game-bgm');
    const sfxSound1 = document.getElementById('sound1');
    const sfxSound2 = document.getElementById('sound2');
    const sfxEnd1 = document.getElementById('sound-end1');
    const sfxEnd2 = document.getElementById('sound-end2');

    gameBgm.volume = 0.3;
    let musicStarted = false;

    function initAudio() {
      if (!musicStarted) {
        gameBgm.play().then(() => {
          musicStarted = true;
        }).catch(() => {});
      }
    }

    function playSound1() {
      try {
        sfxSound1.currentTime = 0;
        sfxSound1.volume = 0.8;
        sfxSound1.play().catch(() => {});
      } catch (e) {}
    }

    function playSound2() {
      try {
        sfxSound2.currentTime = 0;
        sfxSound2.volume = 1.0;
        sfxSound2.play().catch(() => {});
      } catch (e) {}
    }

    function playEndSound(isPerfect) {
      if (isPerfect) {
        sfxEnd2.currentTime = 0;
        sfxEnd2.volume = 1.0;
        sfxEnd2.play().catch(() => {});
      } else {
        sfxEnd1.currentTime = 0;
        sfxEnd1.volume = 1.0;
        sfxEnd1.play().catch(() => {});
      }
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    const images = {};
    function loadImage(key, src) {
      const img = new Image();
      img.src = src;
      img.onload = () => { images[key] = true; };
      img.onerror = () => { images[key] = false; };
      return img;
    }

    const imgSmall = loadImage('small', 'small.png');
    const imgBig = loadImage('big', 'big.png');
    const imgRunRight = loadImage('runRight', 'runright.png');
    const imgRunLeft = loadImage('runLeft', 'runleft.png');

    const startScreen = document.getElementById('start-screen');
    const eventScreen = document.getElementById('event-screen');
    const endScreen = document.getElementById('end-screen');
    const eventTitle = document.getElementById('event-title');
    const eventImage = document.getElementById('event-image');
    const finalScore = document.getElementById('final-score');
    const endTitle = document.getElementById('end-title');
    const totalScoreEl = document.getElementById('total-score');

    let gameState = 'START';
    let totalScore = 0;
    let cameraX = 0;
    let worldWidth = 26000;

    const player = {
      x: 100,
      y: GROUND_Y - 138,
      width: 110,
      height: 138,
      vx: 0,
      vy: 0,
      speed: 6.0,
      jumpPower: -12.5,
      gravity: 0.62,
      isGrounded: false,
      facing: 'right',
      walkTimer: 0
    };

    const SMALL_BASE_WIDTH = 50;
    const BIG_BASE_WIDTH = 95;

    const eventTitles = [
      '2010年模特兒出道',
      '2015年首次米蘭伸展台',
      '2016演員出道',
      '8年無名時期',
      '2024善宰大放異彩,首次亞洲巡迴見面會',
      '2024潑髒水事件',
      '2025成立Fan Club',
      '2024-2026廣告寵兒',
      '2026 大君來了',
      '2026亞洲巡迴萬人見面會'
    ];

    let collectibles = [];
    let eventNodes = [];
    let platforms = [];
    let curvedTerrains = [];

    function addSmallItem(x, targetY, isAbsoluteY = false) {
      let finalY = 0;
      if (isAbsoluteY) {
        finalY = targetY;
      } else {
        const safeYOffset = Math.max(55, targetY);
        finalY = GROUND_Y - safeYOffset;
      }
      if (finalY > GROUND_Y - SMALL_BASE_WIDTH) {
        finalY = GROUND_Y - SMALL_BASE_WIDTH - 5;
      }
      collectibles.push({ x: x, y: finalY, collected: false });
    }

    function generateLevelData() {
      collectibles = [];
      eventNodes = [];
      platforms = [];
      curvedTerrains = [];

      let currentX = 350;

      // 前置 5 個 Small 筒筒
      for (let i = 0; i < 5; i++) {
        addSmallItem(currentX, (i % 2 === 1) ? 140 : 60);
        currentX += 170;
      }

      // 10 個多樣化階梯組合大區塊
      for (let b = 0; b < 10; b++) {
        currentX += 180;
        const layoutType = b % 5;
        let bigYOffset = 0;
        let bigX = 0;

        if (layoutType === 0) {
          // 組合一：金字塔型梯台與高低雙台
          platforms.push({ x: currentX, y: GROUND_Y - 40, w: 70, h: 40 });
          platforms.push({ x: currentX + 60, y: GROUND_Y - 80, w: 70, h: 80 });
          platforms.push({ x: currentX + 120, y: GROUND_Y - 120, w: 80, h: 120 });
          platforms.push({ x: currentX + 190, y: GROUND_Y - 80, w: 70, h: 80 });
          platforms.push({ x: currentX + 250, y: GROUND_Y - 40, w: 70, h: 40 });

          addSmallItem(currentX + 10, GROUND_Y - 40 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 135, GROUND_Y - 120 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 260, GROUND_Y - 40 - SMALL_BASE_WIDTH - 8, true);

          bigX = currentX + 135;
          bigYOffset = 120;
          currentX += 420;

        } else if (layoutType === 1) {
          // 組合二：懸空三連跳階梯 + 右側高階落點
          platforms.push({ x: currentX, y: GROUND_Y - 50, w: 65, h: 50 });
          platforms.push({ x: currentX + 90, y: GROUND_Y - 110, w: 75, h: 20 });
          platforms.push({ x: currentX + 190, y: GROUND_Y - 170, w: 100, h: 20 });
          platforms.push({ x: currentX + 310, y: GROUND_Y - 100, w: 80, h: 100 });

          addSmallItem(currentX + 5, 60);
          addSmallItem(currentX + 225, GROUND_Y - 170 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 330, GROUND_Y - 100 - SMALL_BASE_WIDTH - 8, true);

          bigX = currentX + 225;
          bigYOffset = 170;
          currentX += 480;

        } else if (layoutType === 2) {
          // 組合三：谷底凹弧 + 雙層錯位巨型跳台
          curvedTerrains.push({ x: currentX, w: 280, height: 60, type: 'concave' });
          platforms.push({ x: currentX + 260, y: GROUND_Y - 60, w: 70, h: 60 });
          platforms.push({ x: currentX + 330, y: GROUND_Y - 130, w: 120, h: 130 });
          platforms.push({ x: currentX + 470, y: GROUND_Y - 70, w: 70, h: 70 });

          addSmallItem(currentX + 120, 60);
          addSmallItem(currentX + 370, GROUND_Y - 130 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 485, GROUND_Y - 70 - SMALL_BASE_WIDTH - 8, true);

          bigX = currentX + 380;
          bigYOffset = 130;
          currentX += 600;

        } else if (layoutType === 3) {
          // 組合四：陡峭爬昇步梯 + 懸空降落台
          platforms.push({ x: currentX, y: GROUND_Y - 60, w: 60, h: 60 });
          platforms.push({ x: currentX + 50, y: GROUND_Y - 110, w: 60, h: 110 });
          platforms.push({ x: currentX + 100, y: GROUND_Y - 160, w: 110, h: 160 });
          platforms.push({ x: currentX + 230, y: GROUND_Y - 90, w: 70, h: 20 });

          addSmallItem(currentX + 10, GROUND_Y - 60 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 130, GROUND_Y - 160 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 245, GROUND_Y - 90 - SMALL_BASE_WIDTH - 8, true);

          bigX = currentX + 135;
          bigYOffset = 160;
          currentX += 450;

        } else {
          // 組合五：凸丘 + 鋸齒階梯與跨越平台
          curvedTerrains.push({ x: currentX, w: 260, height: 50, type: 'convex' });
          platforms.push({ x: currentX + 240, y: GROUND_Y - 50, w: 60, h: 50 });
          platforms.push({ x: currentX + 290, y: GROUND_Y - 100, w: 60, h: 100 });
          platforms.push({ x: currentX + 340, y: GROUND_Y - 150, w: 120, h: 150 });
          platforms.push({ x: currentX + 480, y: GROUND_Y - 70, w: 60, h: 70 });

          addSmallItem(currentX + 100, 110);
          addSmallItem(currentX + 380, GROUND_Y - 150 - SMALL_BASE_WIDTH - 8, true);
          addSmallItem(currentX + 490, GROUND_Y - 70 - SMALL_BASE_WIDTH - 8, true);

          bigX = currentX + 390;
          bigYOffset = 150;
          currentX += 580;
        }

        // 放置 Big 事件節點 (確保精準定位)
        eventNodes.push({
          x: bigX, yOffset: bigYOffset,
          title: eventTitles[b], imgIndex: b + 1,
          triggered: false, collected: false
        });

        // 銜接區域：與 Big 拉開距離 (至少 240px 緩衝) 放置剩餘 6 個 Small
        currentX += 240; 
        for (let s = 0; s < 6; s++) {
          const isHigh = (s % 2 === 1);
          if (s === 2 || s === 4) {
            const pY = isHigh ? GROUND_Y - 80 : GROUND_Y - 40;
            platforms.push({ x: currentX - 20, y: pY, w: 75, h: isHigh ? 80 : 40 });
            addSmallItem(currentX - 10, pY - SMALL_BASE_WIDTH - 8, true);
          } else {
            addSmallItem(currentX, isHigh ? 150 : 60);
          }
          currentX += 180;
        }
      }

      // 收尾區段 5 個 Small
      for (let i = 0; i < 5; i++) {
        if (i === 2) {
          platforms.push({ x: currentX, y: GROUND_Y - 60, w: 80, h: 60 });
          addSmallItem(currentX + 15, GROUND_Y - 60 - SMALL_BASE_WIDTH - 8, true);
        } else {
          addSmallItem(currentX, (i % 2 === 1) ? 140 : 60);
        }
        currentX += 170;
      }

      worldWidth = currentX + 600;
    }

    const keys = { left: false, right: false, jump: false };

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.isGrounded && gameState === 'PLAYING') {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    const setupTouchBtn = (elementId, keyName) => {
      const el = document.getElementById(elementId);
      if (!el) return;
      const start = (e) => { e.preventDefault(); initAudio(); keys[keyName] = true; };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
    };

    setupTouchBtn('btn-left', 'left');
    setupTouchBtn('btn-right', 'right');

    const jumpBtn = document.getElementById('btn-jump');
    if (jumpBtn) {
      const triggerJump = (e) => {
        if (e) e.preventDefault();
        initAudio();
        if (player.isGrounded && gameState === 'PLAYING') {
          player.vy = player.jumpPower;
          player.isGrounded = false;
        }
      };
      jumpBtn.addEventListener('touchstart', triggerJump);
      jumpBtn.addEventListener('mousedown', triggerJump);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      startScreen.classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    });

    document.getElementById('close-event-btn').addEventListener('click', () => {
      eventScreen.classList.add('hidden');
      gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      resetGame();
      endScreen.classList.add('hidden');
      if (musicStarted) gameBgm.play().catch(() => {});
      gameState = 'PLAYING';
    });

    function updateScoreDisplay() {
      totalScoreEl.innerText = totalScore.toLocaleString();
    }

    function resetGame() {
      totalScore = 0;
      updateScoreDisplay();

      generateLevelData();

      player.x = 100;
      player.y = GROUND_Y - player.height;
      player.vx = 0;
      player.vy = 0;
      player.walkTimer = 0;
      cameraX = 0;
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.walkTimer += 0.1;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.walkTimer += 0.1;
      } else {
        player.vx = 0;
        player.walkTimer = 0;
      }

      player.vy += player.gravity;

      let nextX = player.x + player.vx;
      const playerBottom = player.y + player.height;

      platforms.forEach(p => {
        if (playerBottom > p.y + 8 && player.y < p.y + p.h - 5) {
          if (player.x + player.width <= p.x && nextX + player.width > p.x) {
            nextX = p.x - player.width;
          } else if (player.x >= p.x + p.w && nextX < p.x + p.w) {
            nextX = p.x + p.w;
          }
        }
      });

      player.x = nextX;
      player.y += player.vy;

      let currentGround = GROUND_Y;
      player.isGrounded = false;

      const playerCenterX = player.x + player.width * 0.5;
      
      curvedTerrains.forEach(ct => {
        if (playerCenterX >= ct.x && playerCenterX <= ct.x + ct.w) {
          const norm = (playerCenterX - ct.x) / ct.w;
          const curveVal = Math.sin(norm * Math.PI) * ct.height;
          if (ct.type === 'concave') {
            currentGround = GROUND_Y + curveVal;
          } else if (ct.type === 'convex') {
            currentGround = GROUND_Y - curveVal;
          }
        }
      });

      platforms.forEach(p => {
        if (player.x + player.width * 0.75 > p.x && player.x + player.width * 0.25 < p.x + p.w) {
          if (player.y + player.height >= p.y - 14 && player.y + player.height <= p.y + 25 && player.vy >= 0) {
            currentGround = Math.min(currentGround, p.y);
          }
        }
      });

      if (player.y + player.height >= currentGround) {
        player.y = currentGround - player.height;
        player.vy = 0;
        player.isGrounded = true;
      }

      if (player.x < 0) player.x = 0;

      // 抵達終點
      if (player.x + player.width >= worldWidth - 350) {
        gameState = 'END';

        const allSmallCollected = collectibles.every(c => c.collected);
        const allBigCollected = eventNodes.every(e => e.collected);
        const isPerfectEnd = allSmallCollected && allBigCollected;

        playEndSound(isPerfectEnd);

        if (isPerfectEnd) {
          endTitle.innerText = "🌟 完美滿貫結局！";
          finalScore.innerHTML = `完美達成！你收集到了全數 100 個筒筒與 10 大歷程！<br>最終完美總得分：<b>${totalScore.toLocaleString()}</b> 分！`;
        } else {
          endTitle.innerText = "🎉 抵達巡演終點！";
          finalScore.innerHTML = `恭喜你完成了偶像歷程巡演！<br>最終總得分：<b>${totalScore.toLocaleString()}</b> 分！`;
        }

        endScreen.classList.remove('hidden');
      }

      cameraX = player.x - CANVAS_WIDTH / 3;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > worldWidth - CANVAS_WIDTH) cameraX = worldWidth - CANVAS_WIDTH;

      // Small 筒筒碰撞收集
      collectibles.forEach(c => {
        if (!c.collected) {
          if (player.x < c.x + SMALL_BASE_WIDTH &&
              player.x + player.width > c.x &&
              player.y < c.y + SMALL_BASE_WIDTH &&
              player.y + player.height > c.y) {
            c.collected = true;
            totalScore += 100000;
            updateScoreDisplay();
            playSound1();
          }
        }
      });

      // Big 大事件精準碰撞判定 (收緊判定盒，避免過早誤觸)
      eventNodes.forEach(e => {
        if (!e.collected) {
          const bigH = BIG_BASE_WIDTH * 1.2;
          const bigY = GROUND_Y - e.yOffset - bigH;
          
          // 將寬度判定盒收緊為原本的 50%，主角必須真正碰到圖片本體
          const hitW = BIG_BASE_WIDTH * 0.5;
          const hitX = e.x - hitW / 2;

          if (player.x < hitX + hitW &&
              player.x + player.width > hitX &&
              player.y < bigY + bigH &&
              player.y + player.height > bigY + 20) {
            
            e.collected = true;
            e.triggered = true;
            totalScore += 500000;
            updateScoreDisplay();
            playSound2();

            gameState = 'PAUSED';
            eventTitle.innerText = e.title;
            eventImage.src = `${e.imgIndex}.png`;
            eventScreen.classList.remove('hidden');
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // 1. 地平線條
      ctx.strokeStyle = '#ff2a74';
      ctx.lineWidth = 4;
      ctx.beginPath();
      
      let stepX = 15;
      ctx.moveTo(0, GROUND_Y);
      for (let px = 0; px <= worldWidth; px += stepX) {
        let py = GROUND_Y;
        for (let ct of curvedTerrains) {
          if (px >= ct.x && px <= ct.x + ct.w) {
            const norm = (px - ct.x) / ct.w;
            const curveVal = Math.sin(norm * Math.PI) * ct.height;
            py = ct.type === 'concave' ? GROUND_Y + curveVal : GROUND_Y - curveVal;
            break;
          }
        }
        ctx.lineTo(px, py);
      }
      ctx.stroke();

      // 2. 繪製階梯與平台
      platforms.forEach(p => {
        ctx.fillStyle = 'rgba(135, 206, 250, 0.35)';
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = '#87cefa';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = '#e0f7fa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.w, p.y);
        ctx.stroke();
      });

      // 3. 繪製 Big 事件圖案
      eventNodes.forEach(e => {
        if (!e.collected) {
          if (imgBig.complete && imgBig.naturalWidth > 0) {
            const aspect = imgBig.naturalHeight / imgBig.naturalWidth;
            const drawW = BIG_BASE_WIDTH;
            const drawH = drawW * aspect;
            ctx.drawImage(imgBig, e.x - drawW/2, GROUND_Y - e.yOffset - drawH, drawW, drawH);
          } else {
            ctx.fillStyle = '#87cefa';
            ctx.fillRect(e.x - 30, GROUND_Y - e.yOffset - 90, 60, 90);
          }
        }
      });

      // 4. 繪製 Small 筒筒
      collectibles.forEach(c => {
        if (!c.collected) {
          if (imgSmall.complete && imgSmall.naturalWidth > 0) {
            const aspect = imgSmall.naturalHeight / imgSmall.naturalWidth;
            const drawW = SMALL_BASE_WIDTH;
            const drawH = drawW * aspect;
            ctx.drawImage(imgSmall, c.x, c.y, drawW, drawH);
          } else {
            ctx.fillStyle = '#ff758c';
            ctx.beginPath();
            ctx.arc(c.x + 25, c.y + 25, 20, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });

      // 5. 繪製主角
      const curImg = player.facing === 'left' ? imgRunLeft : imgRunRight;
      ctx.save();
      
      const centerX = player.x + player.width / 2;
      const centerY = player.y + player.height / 2;
      ctx.translate(centerX, centerY);

      if (player.vx !== 0 && player.isGrounded) {
        const angle = Math.sin(player.walkTimer) * 0.2;
        ctx.rotate(angle);
      }

      if (curImg.complete && curImg.naturalWidth > 0) {
        ctx.drawImage(curImg, -player.width / 2, -player.height / 2, player.width, player.height);
      } else {
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
      }
      ctx.restore();

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    generateLevelData();
    gameLoop();
  </script>
