<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>偶像歷程回顧之旅</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d1a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #1a1a2e;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #score-badge {
      position: absolute;
      top: 55px;
      left: 25px;
      z-index: 20;
      color: #87cefa;
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 10px rgba(135, 206, 250, 0.5);
      pointer-events: none;
    }

    @media (orientation: portrait) {
      #game-wrapper::after {
        content: "📱 請將手機旋轉至橫向以獲得最佳體驗";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 1.2rem;
        z-index: 100;
        padding: 20px;
        box-sizing: border-box;
      }
    }

    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 30;
      text-align: center;
      padding: 10px;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.6rem;
      color: #ff2a74;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 15px;
      max-width: 480px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #00bfff, #87cefa);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 191, 255, 0.4);
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 25px;
      padding-bottom: env(safe-area-inset-bottom);
      pointer-events: none;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 25px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .arrow-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arrow-label {
      position: absolute;
      top: 42px;
      font-size: 1.3rem;
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      font-weight: bold;
      pointer-events: none;
      z-index: 2;
    }

    .arrow-btn {
      width: 110px;
      height: 110px;
      object-fit: contain;
      cursor: pointer;
      opacity: 0.6;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.85));
      transition: opacity 0.2s;
    }

    .arrow-btn:active {
      opacity: 0.9;
    }

    #btn-left {
      transform: scaleX(-1);
    }

    #btn-left:active {
      transform: scaleX(-1) scale(0.92);
    }

    #btn-right:active, #btn-jump:active {
      transform: scale(0.92);
    }

    .touch-btn {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.6rem;
      font-weight: bold;
      backdrop-filter: blur(4px);
      pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.85);
      opacity: 0.6;
    }

    .touch-btn:active {
      opacity: 0.9;
    }

    /* 大事件視窗縮窄，按鈕移至視窗外側右方 */
    #event-modal {
      position: relative;
      background: rgba(20, 20, 35, 0.95);
      border: 2px solid #87cefa;
      border-radius: 16px;
      width: 75%;
      max-width: 380px; /* 視窗寬度縮小 */
      max-height: 80vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: visible; /* 允許按鈕掛在視窗外面 */
    }

    #event-title {
      color: #87cefa;
      font-size: 1.15rem;
      margin-bottom: 5px;
      text-align: center;
    }

    #event-image {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 10px;
      border: none;
      background: transparent;
    }

    /* 繼續前進按鈕於面板外部右方 */
    #close-event-btn {
      position: absolute;
      right: -100px; /* 移到面板右邊外面 */
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 18px;
      box-shadow: 0 4px 15px rgba(0, 191, 255, 0.6);
    }

    #close-event-btn:active {
      transform: translateY(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <!-- 音訊檔案 (包含結局音效 end1.mp3 與 end2.mp3) -->
  <audio id="game-bgm" src="game.mp3" loop preload="auto"></audio>
  <audio id="sound1" src="sound1.mp3" preload="auto"></audio>
  <audio id="sound2" src="sound2.mp3" preload="auto"></audio>
  <audio id="sound-end1" src="end1.mp3" preload="auto"></audio>
  <audio id="sound-end2" src="end2.mp3" preload="auto"></audio>

  <div id="game-wrapper">
    <div id="score-badge">收集筒筒數: <span id="total-score">0</span></div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="controls">
      <div class="btn-group">
        <div class="arrow-container">
          <div class="arrow-label">◄</div>
          <img src="arrow.png" class="arrow-btn" id="btn-left" alt="向左">
        </div>
        <div class="arrow-container">
          <div class="arrow-label">►</div>
          <img src="arrow.png" class="arrow-btn" id="btn-right" alt="向右">
        </div>
      </div>
      <div class="btn-group">
        <div class="touch-btn" id="btn-jump">▲</div>
      </div>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="screen-overlay">
      <h1>偶像星光歷程展</h1>
      <p>
        歡迎來到偶像的回顧之旅！<br>
        • 使用左下角箭頭移動與爬樓梯<br>
        • 使用右下角 <b>▲</b> 跳躍收集高空筒筒與跨越平台<br>
        • 挑戰全收集解鎖隱藏特殊結局！
      </p>
      <button class="btn" id="start-btn">開始旅程</button>
    </div>

    <!-- 大事件彈窗 (按鈕位在視窗右方外側) -->
    <div id="event-screen" class="screen-overlay hidden">
      <div id="event-modal">
        <h2 id="event-title">大事件標題</h2>
        <img id="event-image" src="1.png" alt="事件照片">
        <button class="btn" id="close-event-btn">繼續前進</button>
      </div>
    </div>

    <!-- 結算畫面 -->
    <div id="end-screen" class="screen-overlay hidden">
      <h1 id="end-title">抵達終點！</h1>
      <p id="final-score">恭喜你完成了偶像歷程巡演！</p>
      <button class="btn" id="restart-btn">再次回顧</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 450;
    const GROUND_Y = Math.round(CANVAS_HEIGHT * 0.65);

    const gameBgm = document.getElementById('game-bgm');
    const sfxSound1 = document.getElementById('sound1');
    const sfxSound2 = document.getElementById('sound2');
    const sfxEnd1 = document.getElementById('sound-end1');
    const sfxEnd2 = document.getElementById('sound-end2');

    gameBgm.volume = 0.5;
    let musicStarted = false;

    function initAudio() {
      if (!musicStarted) {
        gameBgm.play().then(() => {
          musicStarted = true;
        }).catch(() => {});
      }
    }

    function playSound1() {
      try {
        sfxSound1.currentTime = 0;
        sfxSound1.volume = 0.8;
        sfxSound1.play().catch(() => {});
      } catch (e) {}
    }

    function playSound2() {
      try {
        sfxSound2.currentTime = 0;
        sfxSound2.volume = 1.0;
        sfxSound2.play().catch(() => {});
      } catch (e) {}
    }

    function playEndSound(isPerfect) {
      gameBgm.pause();
      if (isPerfect) {
        sfxEnd2.currentTime = 0;
        sfxEnd2.volume = 1.0;
        sfxEnd2.play().catch(() => {});
      } else {
        sfxEnd1.currentTime = 0;
        sfxEnd1.volume = 1.0;
        sfxEnd1.play().catch(() => {});
      }
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    const images = {};
    function loadImage(key, src) {
      const img = new Image();
      img.src = src;
      img.onload = () => { images[key] = true; };
      img.onerror = () => { images[key] = false; };
      return img;
    }

    const imgSmall = loadImage('small', 'small.png');
    const imgBig = loadImage('big', 'big.png');
    const imgRunRight = loadImage('runRight', 'runright.png');
    const imgRunLeft = loadImage('runLeft', 'runleft.png');

    const startScreen = document.getElementById('start-screen');
    const eventScreen = document.getElementById('event-screen');
    const endScreen = document.getElementById('end-screen');
    const eventTitle = document.getElementById('event-title');
    const eventImage = document.getElementById('event-image');
    const finalScore = document.getElementById('final-score');
    const endTitle = document.getElementById('end-title');
    const totalScoreEl = document.getElementById('total-score');

    let gameState = 'START';
    let totalScore = 0;
    let cameraX = 0;
    let worldWidth = 16000;

    const player = {
      x: 100,
      y: GROUND_Y - 138,
      width: 110,
      height: 138,
      vx: 0,
      vy: 0,
      speed: 6.0,
      jumpPower: -12.5,
      gravity: 0.62,
      isGrounded: false,
      facing: 'right',
      walkTimer: 0
    };

    const SMALL_BASE_WIDTH = 50;
    const BIG_BASE_WIDTH = 95;

    // 修改：新版大事件標題列表
    const eventTitles = [
      '2010年模特兒出道',
      '2015年首次米蘭伸展台',
      '2016演員出道',
      '8年無名時期',
      '2024善宰大放異彩,首次亞洲巡迴見面會',
      '2024潑髒水事件',
      '2025成立Fan Club',
      '2024-2026廣告寵兒',
      '2026 大君來了',
      '2026亞洲巡迴萬人見面會'
    ];

    let collectibles = [];
    let eventNodes = [];
    let platforms = [];
    let curvedTerrains = [];

    // 修改：大量增加階梯數量，部分 Small 筒筒放置於高空需跳躍收集
    function generateLevelData() {
      collectibles = [];
      eventNodes = [];
      platforms = [];
      curvedTerrains = [];

      let currentX = 400;
      const stepX = 240;

      for (let i = 0; i < 4; i++) {
        // 高空 Small，需要跳躍
        collectibles.push({ x: currentX, yOffset: 160 + i * 20, collected: false });
        currentX += stepX;
      }

      for (let b = 0; b < 10; b++) {
        currentX += 120;
        const layoutType = b % 5;
        let bigYOffset = 0;

        if (layoutType === 0) {
          // 多重階梯爬升與下降
          platforms.push({ x: currentX, y: GROUND_Y - 40, w: 80, h: 40 });
          platforms.push({ x: currentX + 70, y: GROUND_Y - 80, w: 80, h: 80 });
          platforms.push({ x: currentX + 140, y: GROUND_Y - 120, w: 140, h: 120 });
          platforms.push({ x: currentX + 275, y: GROUND_Y - 70, w: 80, h: 70 });

          bigYOffset = 120;
          eventNodes.push({
            x: currentX + 210, yOffset: bigYOffset,
            title: eventTitles[b], imgIndex: b + 1,
            triggered: false, collected: false
          });
          currentX += 400;

        } else if (layoutType === 1) {
          // 密集的連續階梯與懸空跳台
          platforms.push({ x: currentX, y: GROUND_Y - 50, w: 70, h: 50 });
          platforms.push({ x: currentX + 60, y: GROUND_Y - 100, w: 70, h: 100 });
          platforms.push({ x: currentX + 150, y: GROUND_Y - 150, w: 120, h: 20 }); // 高空跳台
          platforms.push({ x: currentX + 290, y: GROUND_Y - 90, w: 70, h: 90 });

          bigYOffset = 150;
          eventNodes.push({
            x: currentX + 210, yOffset: bigYOffset,
            title: eventTitles[b], imgIndex: b + 1,
            triggered: false, collected: false
          });
          currentX += 420;

        } else if (layoutType === 2) {
          // 弧形谷與高台雙重階梯
          curvedTerrains.push({ x: currentX, w: 350, height: 60, type: 'concave' });
          platforms.push({ x: currentX + 330, y: GROUND_Y - 60, w: 80, h: 60 });
          platforms.push({ x: currentX + 400, y: GROUND_Y - 110, w: 140, h: 110 });

          bigYOffset = 110;
          eventNodes.push({
            x: currentX + 470, yOffset: bigYOffset,
            title: eventTitles[b], imgIndex: b + 1,
            triggered: false, collected: false
          });
          currentX += 580;

        } else if (layoutType === 3) {
          // 山谷對跳高台 + 中間雙跳台
          platforms.push({ x: currentX, y: GROUND_Y - 80, w: 100, h: 80 });
          platforms.push({ x: currentX + 130, y: GROUND_Y - 130, w: 80, h: 20 });
          platforms.push({ x: currentX + 240, y: GROUND_Y - 80, w: 120, h: 80 });

          bigYOffset = 80;
          eventNodes.push({
            x: currentX + 300, yOffset: bigYOffset,
            title: eventTitles[b], imgIndex: b + 1,
            triggered: false, collected: false
          });
          currentX += 420;

        } else {
          // 凸型丘與陡峭階梯
          curvedTerrains.push({ x: currentX, w: 300, height: 60, type: 'convex' });
          platforms.push({ x: currentX + 290, y: GROUND_Y - 50, w: 70, h: 50 });
          platforms.push({ x: currentX + 350, y: GROUND_Y - 100, w: 130, h: 100 });

          bigYOffset = 100;
          eventNodes.push({
            x: currentX + 415, yOffset: bigYOffset,
            title: eventTitles[b], imgIndex: b + 1,
            triggered: false, collected: false
          });
          currentX += 520;
        }

        // 生成 Small 筒筒（安排交替的高空跳躍位置）
        if (b < 9) {
          for (let s = 0; s < 5; s++) {
            // s % 2 === 1 時需要 jump 才可以吃到
            let yOff = (s % 2 === 1) ? 175 : 55;
            collectibles.push({ x: currentX, yOffset: yOff, collected: false });
            currentX += stepX;
          }
        }
      }

      currentX += 100;
      for (let i = 0; i < 4; i++) {
        collectibles.push({ x: currentX, yOffset: 160, collected: false });
        currentX += stepX;
      }

      worldWidth = currentX + 800;
    }

    const keys = { left: false, right: false, jump: false };

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.isGrounded && gameState === 'PLAYING') {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    const setupTouchBtn = (elementId, keyName) => {
      const el = document.getElementById(elementId);
      if (!el) return;
      const start = (e) => { e.preventDefault(); initAudio(); keys[keyName] = true; };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
    };

    setupTouchBtn('btn-left', 'left');
    setupTouchBtn('btn-right', 'right');

    const jumpBtn = document.getElementById('btn-jump');
    if (jumpBtn) {
      const triggerJump = (e) => {
        if (e) e.preventDefault();
        initAudio();
        if (player.isGrounded && gameState === 'PLAYING') {
          player.vy = player.jumpPower;
          player.isGrounded = false;
        }
      };
      jumpBtn.addEventListener('touchstart', triggerJump);
      jumpBtn.addEventListener('mousedown', triggerJump);
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      startScreen.classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
    });

    document.getElementById('close-event-btn').addEventListener('click', () => {
      eventScreen.classList.add('hidden');
      gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      resetGame();
      endScreen.classList.add('hidden');
      if (musicStarted) gameBgm.play().catch(() => {});
      gameState = 'PLAYING';
    });

    function updateScoreDisplay() {
      totalScoreEl.innerText = totalScore.toLocaleString();
    }

    function resetGame() {
      totalScore = 0;
      updateScoreDisplay();

      generateLevelData();

      player.x = 100;
      player.y = GROUND_Y - player.height;
      player.vx = 0;
      player.vy = 0;
      player.walkTimer = 0;
      cameraX = 0;
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.walkTimer += 0.1;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.walkTimer += 0.1;
      } else {
        player.vx = 0;
        player.walkTimer = 0;
      }

      player.vy += player.gravity;

      let nextX = player.x + player.vx;
      const feetY = player.y + player.height;

      platforms.forEach(p => {
        if (feetY > p.y + 12 && player.y < p.y + p.h) {
          if (player.x + player.width <= p.x && nextX + player.width > p.x) {
            nextX = p.x - player.width;
          } else if (player.x >= p.x + p.w && nextX < p.x + p.w) {
            nextX = p.x + p.w;
          }
        }
      });

      player.x = nextX;
      player.y += player.vy;

      let currentGround = GROUND_Y;
      player.isGrounded = false;

      const playerCenterX = player.x + player.width * 0.5;
      
      curvedTerrains.forEach(ct => {
        if (playerCenterX >= ct.x && playerCenterX <= ct.x + ct.w) {
          const norm = (playerCenterX - ct.x) / ct.w;
          const curveVal = Math.sin(norm * Math.PI) * ct.height;
          if (ct.type === 'concave') {
            currentGround = GROUND_Y + curveVal;
          } else if (ct.type === 'convex') {
            currentGround = GROUND_Y - curveVal;
          }
        }
      });

      platforms.forEach(p => {
        if (player.x + player.width * 0.7 > p.x && player.x + player.width * 0.3 < p.x + p.w) {
          if (player.y + player.height >= p.y - 12 && player.y + player.height <= p.y + 20 && player.vy >= 0) {
            currentGround = Math.min(currentGround, p.y);
          }
        }
      });

      if (player.y + player.height >= currentGround) {
        player.y = currentGround - player.height;
        player.vy = 0;
        player.isGrounded = true;
      }

      if (player.x < 0) player.x = 0;

      // 抵達終點結算
      if (player.x + player.width >= worldWidth - 400) {
        gameState = 'END';

        // 檢查是否達成全收集 (所有 small 和 big 都吃到)
        const allSmallCollected = collectibles.every(c => c.collected);
        const allBigCollected = eventNodes.every(e => e.collected);
        const isPerfectEnd = allSmallCollected && allBigCollected;

        playEndSound(isPerfectEnd);

        if (isPerfectEnd) {
          endTitle.innerText = "🌟 完美大滿貫結局！";
          finalScore.innerHTML = `太不可思議了！你收集到了全數的歷程照片與星光筒筒！<br>最終完美總得分：<b>${totalScore.toLocaleString()}</b> 分！`;
        } else {
          endTitle.innerText = "🎉 抵達巡演終點！";
          finalScore.innerHTML = `恭喜你完成了偶像歷程巡演！<br>最終總得分：<b>${totalScore.toLocaleString()}</b> 分！`;
        }

        endScreen.classList.remove('hidden');
      }

      cameraX = player.x - CANVAS_WIDTH / 3;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > worldWidth - CANVAS_WIDTH) cameraX = worldWidth - CANVAS_WIDTH;

      collectibles.forEach(c => {
        if (!c.collected) {
          const itemY = GROUND_Y - c.yOffset;
          if (player.x < c.x + SMALL_BASE_WIDTH &&
              player.x + player.width > c.x &&
              player.y < itemY + SMALL_BASE_WIDTH &&
              player.y + player.height > itemY) {
            c.collected = true;
            totalScore += 100000;
            updateScoreDisplay();
            playSound1();
          }
        }
      });

      eventNodes.forEach(e => {
        if (!e.collected) {
          const bigH = BIG_BASE_WIDTH * 1.2;
          const bigY = GROUND_Y - e.yOffset - bigH;
          
          if (player.x < e.x + BIG_BASE_WIDTH/2 &&
              player.x + player.width > e.x - BIG_BASE_WIDTH/2 &&
              player.y < bigY + bigH &&
              player.y + player.height > bigY) {
            
            e.collected = true;
            e.triggered = true;
            totalScore += 500000;
            updateScoreDisplay();
            playSound2();

            gameState = 'PAUSED';
            eventTitle.innerText = e.title;
            eventImage.src = `${e.imgIndex}.png`;
            eventScreen.classList.remove('hidden');
          }
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // 1. 繪製弧形與地形線條
      ctx.strokeStyle = '#ff2a74';
      ctx.lineWidth = 4;
      ctx.beginPath();
      
      let stepX = 15;
      ctx.moveTo(0, GROUND_Y);
      for (let px = 0; px <= worldWidth; px += stepX) {
        let py = GROUND_Y;
        for (let ct of curvedTerrains) {
          if (px >= ct.x && px <= ct.x + ct.w) {
            const norm = (px - ct.x) / ct.w;
            const curveVal = Math.sin(norm * Math.PI) * ct.height;
            py = ct.type === 'concave' ? GROUND_Y + curveVal : GROUND_Y - curveVal;
            break;
          }
        }
        ctx.lineTo(px, py);
      }
      ctx.stroke();

      // 2. 畫階梯與高台平台
      platforms.forEach(p => {
        ctx.fillStyle = 'rgba(135, 206, 250, 0.35)';
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = '#87cefa';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        ctx.strokeStyle = '#e0f7fa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.w, p.y);
        ctx.stroke();
      });

      // 3. 畫 Big 展區
      eventNodes.forEach(e => {
        if (!e.collected) {
          if (imgBig.complete && imgBig.naturalWidth > 0) {
            const aspect = imgBig.naturalHeight / imgBig.naturalWidth;
            const drawW = BIG_BASE_WIDTH;
            const drawH = drawW * aspect;
            ctx.drawImage(imgBig, e.x - drawW/2, GROUND_Y - e.yOffset - drawH, drawW, drawH);
          } else {
            ctx.fillStyle = '#87cefa';
            ctx.fillRect(e.x - 30, GROUND_Y - e.yOffset - 90, 60, 90);
          }
        }
      });

      // 4. 畫 Small 筒筒
      collectibles.forEach(c => {
        if (!c.collected) {
          const itemY = GROUND_Y - c.yOffset;
          if (imgSmall.complete && imgSmall.naturalWidth > 0) {
            const aspect = imgSmall.naturalHeight / imgSmall.naturalWidth;
            const drawW = SMALL_BASE_WIDTH;
            const drawH = drawW * aspect;
            ctx.drawImage(imgSmall, c.x, itemY, drawW, drawH);
          } else {
            ctx.fillStyle = '#ff758c';
            ctx.beginPath();
            ctx.arc(c.x + 25, itemY + 25, 20, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });

      // 5. 畫角色
      const curImg = player.facing === 'left' ? imgRunLeft : imgRunRight;
      ctx.save();
      
      const centerX = player.x + player.width / 2;
      const centerY = player.y + player.height / 2;
      ctx.translate(centerX, centerY);

      if (player.vx !== 0 && player.isGrounded) {
        const angle = Math.sin(player.walkTimer) * 0.2;
        ctx.rotate(angle);
      }

      if (curImg.complete && curImg.naturalWidth > 0) {
        ctx.drawImage(curImg, -player.width / 2, -player.height / 2, player.width, player.height);
      } else {
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
      }
      ctx.restore();

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    generateLevelData();
    gameLoop();
  </script>
